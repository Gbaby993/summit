<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Summit</title>
<meta name="description" content="Daily training log. One line per habit, one mark per day.">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Summit">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>

<header class="top">
  <button class="avatar" id="avatarBtn" aria-label="Profile and settings">S</button>
  <button class="pill ghost" id="todayBtn">Today</button>
</header>

<section class="cards" id="cards" aria-label="This week"></section>

<h1 class="hero" id="hero">Progress is power.<br>Let's lock in.</h1>

<section class="month">
  <div class="month-head">
    <button class="nav" id="prev" aria-label="Previous month">&#8249;</button>
    <div class="month-title"><span id="monthName">Month</span> <span class="year" id="yearName">Year</span></div>
    <button class="nav" id="next" aria-label="Next month">&#8250;</button>
  </div>
  <div class="grid-wrap" id="gridWrap">
    <table class="grid" id="grid" aria-label="Habit grid"></table>
  </div>
  <button class="add" id="addHabit">+ Add a line</button>
</section>

<button class="checkin" id="checkinBtn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
  Check in
</button>

<div class="scrim" id="scrim" hidden></div>

<!-- Check-in: today's lines -->
<section class="sheet" id="checkin" hidden aria-modal="true" role="dialog">
  <div class="sheet-handle"></div>
  <div class="sheet-title"><span class="eyebrow" id="checkinDate">Today</span><h2>Check in</h2></div>
  <div class="checklist" id="checklist"></div>
  <div class="sheet-actions"><button class="primary" id="closeCheckin">Done</button></div>
</section>

<!-- Habit detail -->
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-handle"></div>
  <label class="field">
    <span>Name</span>
    <input id="habitName" type="text" maxlength="28" autocomplete="off" autocapitalize="words" enterkeyhint="done">
  </label>
  <div class="stat-row">
    <div><strong id="statStreak">0</strong><span>streak</span></div>
    <div><strong id="statBest">0</strong><span>best</span></div>
    <div><strong id="statMonth">0</strong><span>this month</span></div>
    <div><strong id="statTotal">0</strong><span>all time</span></div>
  </div>
  <div class="sheet-actions">
    <button class="ghost" id="moveUp">&uarr; Move up</button>
    <button class="ghost" id="moveDown">&darr; Move down</button>
  </div>
  <div class="sheet-actions">
    <button class="danger" id="deleteHabit">Delete</button>
    <button class="primary" id="doneHabit">Done</button>
  </div>
</section>

<!-- Profile / settings -->
<section class="sheet" id="menu" hidden aria-modal="true" role="dialog">
  <div class="sheet-handle"></div>
  <div class="sheet-title"><span class="eyebrow">Profile</span><h2>Summit</h2></div>
  <label class="field">
    <span>Your name</span>
    <input id="userName" type="text" maxlength="20" autocomplete="given-name" autocapitalize="words" enterkeyhint="done" placeholder="First name">
  </label>
  <p class="muted">Your log lives on this device only. Export now and then to keep a copy.</p>
  <div class="sheet-actions">
    <button class="ghost" id="exportBtn">Export</button>
    <button class="ghost" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  <div class="sheet-actions">
    <button class="primary" id="closeMenu">Done</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
